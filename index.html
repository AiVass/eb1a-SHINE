    function EB1ADashboard() {
      const [profilePath, setProfilePath] = useState("FOUNDER");
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedStatusFilter, setSelectedStatusFilter] = useState("ALL");
      const [activeTab, setActiveTab] = useState("pipeline");
      const [artifacts, setArtifacts] = useState(() => {
        let flat = [];
        initialPhases.forEach((p) => {
          p.artifacts.forEach((art) => {
            flat.push({ ...art, phaseId: p.id, phaseTitle: p.title, phaseColor: p.color });
          });
        });
        return flat;
      });

      const toggleArtifactStatus = (id) => {
        setArtifacts((prev) =>
          prev.map((art) => {
            if (art.id === id) {
              const nextStatus =
                art.status === "Not Started"
                  ? "In Progress"
                  : art.status === "In Progress"
                  ? "Completed"
                  : "Not Started";
              return { ...art, status: nextStatus };
            }
            return art;
          })
        );
      };

      const filteredArtifacts = useMemo(() => {
        return artifacts.filter((art) => {
          const matchPath =
            profilePath === "ALL" ||
            !art.pathTag ||
            art.pathTag === profilePath;
          const matchSearch =
            art.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            art.id.toLowerCase().includes(searchTerm.toLowerCase()) ||
            art.description.toLowerCase().includes(searchTerm.toLowerCase());
          const matchStatus =
            selectedStatusFilter === "ALL" || art.status === selectedStatusFilter;
          return matchPath && matchSearch && matchStatus;
        });
      }, [artifacts, profilePath, searchTerm, selectedStatusFilter]);

      const stats = useMemo(() => {
        const total = filteredArtifacts.length;
        const completed = filteredArtifacts.filter((a) => a.status === "Completed").length;
        const inProgress = filteredArtifacts.filter((a) => a.status === "In Progress").length;
        const criticalRemaining = filteredArtifacts.filter(
          (a) => a.urgency.startsWith("CRITICAL") && a.status !== "Completed"
        ).length;
        const progressPercent = total > 0 ? Math.round((completed / total) * 100) : 0;
        return { total, completed, inProgress, criticalRemaining, progressPercent };
      }, [filteredArtifacts]);

      const criteriaStats = useMemo(() => {
        const critArtifacts = artifacts.filter((a) => a.criterionNum !== undefined);
        const completed = critArtifacts.filter((a) => a.status === "Completed").length;
        const inProgress = critArtifacts.filter((a) => a.status === "In Progress").length;
        return {
          total: 10,
          mapped: critArtifacts.length,
          completed,
          inProgress,
        };
      }, [artifacts]);

      return (
        <div style={{ padding: "24px 32px", minHeight: "100vh" }}>
          {/* Header */}
          <div style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            borderBottom: "1px solid #1E293B",
            paddingBottom: "20px",
            marginBottom: "24px",
            flexWrap: "wrap",
            gap: "16px",
          }}>
            <div>
              <div style={{
                fontSize: "11px",
                color: "#C9A84C",
                letterSpacing: "2px",
                fontWeight: 700,
                textTransform: "uppercase",
                marginBottom: "4px",
              }}>
                AiVass Command Center
              </div>
              <h1 style={{ fontSize: "26px", fontWeight: 700, color: "#F8FAFC", margin: 0 }}>
                EB-1A Self-Petition System Dashboard
              </h1>
            </div>

            {/* Pathway Switcher */}
            <div style={{
              background: "#0F172A",
              border: "1px solid #334155",
              borderRadius: "8px",
              padding: "4px",
              display: "flex",
              alignItems: "center",
              gap: "4px",
            }}>
              <span style={{ fontSize: "11px", color: "#94A3B8", padding: "0 8px", fontWeight: 600 }}>
                PROFILE PATH:
              </span>
              {[
                { id: "FOUNDER", label: "🏢 Founder", color: "#C9A84C" },
                { id: "SPECIALIST", label: "👤 Specialist", color: "#4A7FC1" },
                { id: "ALL", label: "🌐 Show All", color: "#94A3B8" },
              ].map((path) => {
                const active = profilePath === path.id;
                return (
                  <button
                    key={path.id}
                    onClick={() => setProfilePath(path.id)}
                    style={{
                      background: active ? path.color : "transparent",
                      color: active ? "#000" : "#94A3B8",
                      border: "none",
                      borderRadius: "6px",
                      padding: "6px 14px",
                      fontSize: "12px",
                      fontWeight: 700,
                      cursor: "pointer",
                      transition: "all 0.2s ease",
                    }}
                  >
                    {path.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* KPI Cards */}
          <div style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))",
            gap: "16px",
            marginBottom: "28px",
          }}>
            <div style={{ background: "#0F172A", border: "1px solid #1E293B", borderRadius: "10px", padding: "16px 20px" }}>
              <div style={{ fontSize: "12px", color: "#64748B", fontWeight: 600 }}>PETITION PROGRESS</div>
              <div style={{ fontSize: "28px", fontWeight: 800, color: "#38BDF8", marginTop: "4px" }}>
                {stats.progressPercent}%
              </div>
              <div style={{ width: "100%", height: "6px", background: "#1E293B", borderRadius: "3px", marginTop: "8px", overflow: "hidden" }}>
                <div style={{ width: `${stats.progressPercent}%`, height: "100%", background: "#38BDF8", transition: "width 0.3s ease" }} />
              </div>
            </div>

            <div style={{ background: "#0F172A", border: "1px solid #1E293B", borderRadius: "10px", padding: "16px 20px" }}>
              <div style={{ fontSize: "12px", color: "#64748B", fontWeight: 600 }}>ARTIFACT STATUS</div>
              <div style={{ fontSize: "24px", fontWeight: 700, color: "#F8FAFC", marginTop: "4px" }}>
                <span style={{ color: "#4ADE80" }}>{stats.completed}</span> /{" "}
                <span style={{ color: "#F59E0B" }}>{stats.inProgress}</span> /{" "}
                <span style={{ color: "#64748B" }}>{stats.total - stats.completed - stats.inProgress}</span>
              </div>
              <div style={{ fontSize: "11px", color: "#94A3B8", marginTop: "4px" }}>
                Done · In Progress · Remaining
              </div>
            </div>

            <div style={{ background: "#0F172A", border: "1px solid #1E293B", borderRadius: "10px", padding: "16px 20px" }}>
              <div style={{ fontSize: "12px", color: "#64748B", fontWeight: 600 }}>CRITICAL BLOCKS REMAINING</div>
              <div style={{ fontSize: "28px", fontWeight: 800, color: stats.criticalRemaining > 0 ? "#EF4444" : "#4ADE80", marginTop: "4px" }}>
                {stats.criticalRemaining}
              </div>
              <div style={{ fontSize: "11px", color: "#94A3B8", marginTop: "4px" }}>Must complete before filing</div>
            </div>

            <div style={{ background: "#0F172A", border: "1px solid #1E293B", borderRadius: "10px", padding: "16px 20px" }}>
              <div style={{ fontSize: "12px", color: "#64748B", fontWeight: 600 }}>CRITERIA READINESS (MIN 3)</div>

                {criteriaStats.completed + criteriaStats.inProgress} / 10
              </div>
              <div style={{ fontSize: "11px", color: "#94A3B8", marginTop: "4px" }}>
                {criteriaStats.completed} verified · {criteriaStats.inProgress} active draft
              </div>
            </div>
          </div>

          {/* Control Bar */}
          <div style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            background: "#0F172A",
            padding: "12px 16px",
            borderRadius: "10px",
            border: "1px solid #1E293B",
            marginBottom: "24px",
            flexWrap: "wrap",
            gap: "12px",
          }}>
            <div style={{ display: "flex", gap: "8px" }}>
              {[
                { id: "pipeline", label: "🗺 Phase Pipeline" },
                { id: "kanban", label: "📋 Progress Board" },
                { id: "criteria", label: "🎯 Criteria Analysis Matrix" },
              ].map((tab) => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  style={{
                    background: activeTab === tab.id ? "#1E293B" : "transparent",
                    color: activeTab === tab.id ? "#F8FAFC" : "#94A3B8",
                    border: "1px solid",
                    borderColor: activeTab === tab.id ? "#334155" : "transparent",
                    borderRadius: "6px",
                    padding: "8px 16px",
                    fontSize: "13px",
                    fontWeight: 600,
                    cursor: "pointer",
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            <div style={{ display: "flex", gap: "12px", alignItems: "center" }}>
              <select
                value={selectedStatusFilter}
                onChange={(e) => setSelectedStatusFilter(e.target.value)}
                style={{
                  background: "#1E293B",
                  color: "#E2E8F0",
                  border: "1px solid #334155",
                  borderRadius: "6px",
                  padding: "8px 12px",
                  fontSize: "12px",
                  outline: "none",
                }}
              >
                <option value="ALL">All Statuses</option>
                <option value="Not Started">Not Started</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>

              <input
                type="text"
                placeholder="Search artifacts..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                style={{
                  background: "#1E293B",
                  color: "#E2E8F0",
                  border: "1px solid #334155",
                  borderRadius: "6px",
                  padding: "8px 14px",
                  fontSize: "12px",
                  outline: "none",
                  width: "180px",
                }}
              />
            </div>
          </div>

          {/* VIEW 1: PHASE PIPELINE */}
          {activeTab === "pipeline" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "28px" }}>
              {initialPhases.map((phase) => {
                const phaseArtifacts = filteredArtifacts.filter((a) => a.phaseId === phase.id);
                if (phaseArtifacts.length === 0) return null;

                return (
                  <div
                    key={phase.id}
                    style={{
                      background: "#0D1117",
                      border: `1px solid ${phase.color}33`,
                      borderRadius: "12px",
                      padding: "20px",
                    }}
                  >
                    <div style={{
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      marginBottom: "16px",
                      borderBottom: `1px solid ${phase.color}22`,
                      paddingBottom: "12px",
                    }}>
                      <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
                        <div style={{
                          width: "36px",
                          height: "36px",
                          borderRadius: "50%",
                          background: phase.bg,
                          border: `2px solid ${phase.color}`,
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          fontWeight: 700,
                          color: phase.color,
                          fontSize: "14px",
                        }}>
                          {phase.id}
                        </div>
                        <div>
                          <span style={{ fontSize: "10px", color: phase.color, letterSpacing: "1.5px", fontWeight: 700, textTransform: "uppercase" }}>
                            {phase.label}
                          </span>
                          <h2 style={{ fontSize: "18px", fontWeight: 700, margin: 0, color: "#F8FAFC" }}>
                            {phase.title}{" "}
                            <span style={{ fontSize: "14px", color: "#64748B", fontWeight: 400 }}>
                              — {phase.subtitle}
                            </span>
                          </h2>
                        </div>
                      </div>
                      <div style={{
                        fontSize: "12px",
                        color: phase.color,
                        background: phase.bg,
                        padding: "4px 12px",
                        borderRadius: "20px",
                        border: `1px solid ${phase.color}44`,
                      }}>
                        {phaseArtifacts.length} Artifacts
                      </div>
                    </div>

                    <div style={{
                      display: "grid",
                      gridTemplateColumns: "repeat(auto-fill, minmax(320px, 1fr))",
                      gap: "16px",
                    }}>
                      {phaseArtifacts.map((art) => {
                        const isCompleted = art.status === "Completed";
                        const isInProgress = art.status === "In Progress";

                        return (
                          <div
                            key={art.id}
                            onClick={() => toggleArtifactStatus(art.id)}
                            style={{
                              background: "#161B22",
                              border: `1px solid ${
                                isCompleted
                                  ? "#22C55E66"
                                  : isInProgress
                                  ? "#F59E0B66"
                                  : "#30363D"
                              }`,
                              borderRadius: "8px",
                              padding: "16px",
                              cursor: "pointer",
                              transition: "all 0.2s ease",
                            }}
                          >
                            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "8px" }}>
                              <span style={{
                                background: "#21262D",
                                border: "1px solid #30363D",
                                borderRadius: "4px",
                                padding: "2px 6px",
                                fontSize: "11px",
                                fontWeight: 700,
                                color: phase.color,
                              }}>
                                {art.id}
                              </span>

                              <span style={{
                                fontSize: "10px",
                                fontWeight: 700,
                                padding: "2px 8px",
                                borderRadius: "4px",
                                background: isCompleted ? "#14532D" : isInProgress ? "#78350F" : "#1E293B",
                                color: isCompleted ? "#4ADE80" : isInProgress ? "#FBBF24" : "#94A3B8",
                              }}>
                                {art.status}
                              </span>
                            </div>

                            <h3 style={{ fontSize: "14px", fontWeight: 700, margin: "0 0 6px", color: "#F1F5F9" }}>
                              {art.title}
                            </h3>

                            {art.pathTag && (
                              <span style={{
                                display: "inline-block",
                                background: art.pathTag === "FOUNDER" ? "#C9A84C22" : "#4A7FC122",
                                color: art.pathTag === "FOUNDER" ? "#C9A84C" : "#4A7FC1",
                                border: `1px solid ${art.pathTag === "FOUNDER" ? "#C9A84C44" : "#4A7FC144"}`,
                                fontSize: "10px",
                                fontWeight: 700,
                                padding: "2px 6px",
                                borderRadius: "4px",
                                marginBottom: "8px",
                              }}>
                                {art.pathTag} SPECIFIC
                              </span>
                            )}

                            <p style={{ fontSize: "12px", color: "#8B949E", margin: "0 0 12px", lineHeight: "1.4" }}>
                              {art.description}
                            </p>

                            <div style={{
                              fontSize: "11px",
                              color: "#6E7681",
                              borderTop: "1px solid #21262D",
                              paddingTop: "8px",
                              display: "flex",
                              justifyContent: "space-between",
                            }}>
                              <span>OUT: {art.output}</span>
                              <span style={{ color: phase.color }}>FEEDS → {art.feedsInto}</span>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* VIEW 2: KANBAN BOARD */}
          {activeTab === "kanban" && (
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: "20px", alignItems: "start" }}>
              {["Not Started", "In Progress", "Completed"].map((status) => {
                const list = filteredArtifacts.filter((a) => a.status === status);
                const statusColor = status === "Completed" ? "#22C55E" : status === "In Progress" ? "#F59E0B" : "#64748B";

                return (
                  <div
                    key={status}
                    style={{
                      background: "#0D1117",
                      border: `1px solid ${statusColor}33`,
                      borderRadius: "10px",
                      padding: "16px",
                      minHeight: "500px",
                    }}
                  >
                    <div style={{
                      display: "flex",
                      justifyContent: "space-between",
                      alignItems: "center",
                      marginBottom: "16px",
                      borderBottom: `2px solid ${statusColor}`,
                      paddingBottom: "8px",
                    }}>
                      <h3 style={{ fontSize: "15px", fontWeight: 700, margin: 0, color: "#F8FAFC" }}>
                        {status}
                      </h3>
                      <span style={{
                        background: "#1E293B",
                        color: statusColor,
                        fontSize: "12px",
                        fontWeight: 700,
                        padding: "2px 8px",
                        borderRadius: "12px",
                      }}>
                        {list.length}
                      </span>
                    </div>

                    <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                      {list.map((art) => (
                        <div
                          key={art.id}
                          onClick={() => toggleArtifactStatus(art.id)}
                          style={{
                            background: "#161B22",
                            border: "1px solid #30363D",
                            borderRadius: "8px",
                            padding: "12px",
                            cursor: "pointer",
                          }}
                        >
                          <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: art.phaseColor, fontWeight: 700, marginBottom: "4px" }}>
                            <span>{art.id}</span>
                            <span>{art.phaseTitle}</span>
                          </div>
                          <div style={{ fontSize: "13px", fontWeight: 700, color: "#F1F5F9", marginBottom: "6px" }}>
                            {art.title}
                          </div>
                          <div style={{ fontSize: "11px", color: "#8B949E" }}>
                            Format: {art.format}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {/* VIEW 3: CRITERIA MATRIX */}
          {activeTab === "criteria" && (
            <div style={{ background: "#0D1117", border: "1px solid #1E293B", borderRadius: "12px", padding: "24px" }}>
              <h2 style={{ fontSize: "18px", fontWeight: 700, color: "#F8FAFC", margin: "0 0 16px" }}>
                10 USCIS Criteria Diagnostic Mapping
              </h2>
              <p style={{ fontSize: "13px", color: "#94A3B8", marginBottom: "20px" }}>
                USCIS requires satisfying a minimum of 3 out of 10 criteria. Click an artifact state to update evidence gathering status.
              </p>

              <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                {artifacts
                  .filter((a) => a.criterionNum !== undefined)
                  .map((art) => {
                    const isCompleted = art.status === "Completed";
                    const isInProgress = art.status === "In Progress";

                    return (
                      <div
                        key={art.id}
                        style={{
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "space-between",
                          background: "#161B22",
                          border: "1px solid #30363D",
                          borderRadius: "8px",
                          padding: "12px 16px",
                          gap: "16px",
                        }}
                      >
                        <div style={{ width: "120px", flexShrink: 0 }}>
                          <span style={{ fontSize: "12px", fontWeight: 700, color: "#2E8B57" }}>
                            Criterion {art.criterionNum}
                          </span>
                        </div>

                        <div style={{ flex: 1 }}>
                          <div style={{ fontSize: "14px", fontWeight: 700, color: "#F8FAFC" }}>
                            {art.title}
                          </div>
                          <div style={{ fontSize: "12px", color: "#8B949E" }}>
                            {art.description}
                          </div>
                        </div>

                        <button
                          onClick={() => toggleArtifactStatus(art.id)}
                          style={{
                            background: isCompleted ? "#14532D" : isInProgress ? "#78350F" : "#1E293B",
                            color: isCompleted ? "#4ADE80" : isInProgress ? "#FBBF24" : "#94A3B8",
                            border: "1px solid #334155",
                            borderRadius: "6px",
                            padding: "6px 12px",
                            fontSize: "12px",
                            fontWeight: 700,
                            cursor: "pointer",
                          }}
                        >
                          {art.status}
                        </button>
                      </div>
                    );
                  })}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<EB1ADashboard />);
  </script>
</body>
</html>
